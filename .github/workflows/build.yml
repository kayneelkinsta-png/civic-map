name: Production build

on:
  push:
    branches: ["main", "codex/remove-lovable-hosting"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
      - name: Verify server output
        run: test -f .output/server/index.mjs
